<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body selection:bg-primary/30 min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#0E0E0E]">
<div class="flex items-center gap-4">
<button class="text-[#3FFF8B] active:scale-95 transition-transform">
<span class="material-symbols-outlined">settings</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-xl text-[#3FFF8B]">ML-7724</h1>
</div>
<button class="text-[#2C2C2C] hover:text-[#3FFF8B] transition-colors duration-200 active:scale-95 transition-transform">
<span class="material-symbols-outlined">logout</span>
</button>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto space-y-8">
<!-- Section 1: Session Controls (Room Code) -->
<section>
<div class="bg-surface-container-low rounded-xl p-6 relative overflow-hidden group">
<div class="flex justify-between items-center">
<div>
<p class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant mb-1">Session ID</p>
<h2 class="font-mono text-4xl font-black text-primary tracking-tighter">#84920</h2>
</div>
<button class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center text-primary active:scale-90 transition-all border border-outline-variant/20 hover:bg-primary/10">
<span class="material-symbols-outlined">content_copy</span>
</button>
</div>
<!-- Tactical Decoration -->
<div class="absolute -right-4 -bottom-4 opacity-5 pointer-events-none">
<span class="material-symbols-outlined text-8xl" style="font-variation-settings: 'FILL' 1;">qr_code_2</span>
</div>
</div>
</section>
<!-- Section 2: Fiscal Rules -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm">account_balance</span>
<h3 class="font-label text-xs uppercase tracking-widest font-bold">Fiscal Rules</h3>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Starting Capital -->
<div class="bg-surface-container-low p-5 rounded-xl border-l-2 border-primary/30">
<div class="flex justify-between items-start mb-4">
<label class="font-body text-sm text-on-surface-variant">Starting Capital</label>
<span class="material-symbols-outlined text-xs text-primary">info</span>
</div>
<div class="flex items-center justify-between bg-surface-container-lowest rounded-lg p-2">
<button class="w-8 h-8 rounded bg-surface-container-high flex items-center justify-center active:bg-primary/20">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<div class="font-mono text-xl font-bold text-on-surface">$1,500</div>
<button class="w-8 h-8 rounded bg-surface-container-high flex items-center justify-center active:bg-primary/20">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
<!-- GO Amount -->
<div class="bg-surface-container-low p-5 rounded-xl border-l-2 border-tertiary/30">
<div class="flex justify-between items-start mb-4">
<label class="font-body text-sm text-on-surface-variant">GO Bonus</label>
<span class="material-symbols-outlined text-xs text-tertiary">autorenew</span>
</div>
<div class="flex items-center justify-between bg-surface-container-lowest rounded-lg p-2">
<button class="w-8 h-8 rounded bg-surface-container-high flex items-center justify-center active:bg-tertiary/20">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<div class="font-mono text-xl font-bold text-on-surface">$200</div>
<button class="w-8 h-8 rounded bg-surface-container-high flex items-center justify-center active:bg-tertiary/20">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
</div>
</section>
<!-- Section 3: Player Management -->
<section class="space-y-4">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">group</span>
<h3 class="font-label text-xs uppercase tracking-widest font-bold">Active Players (3/8)</h3>
</div>
<button class="text-xs text-primary-dim font-bold tracking-tight">ADD BOT</button>
</div>
<div class="space-y-3">
<!-- Player: Sarah (Self/Host) -->
<div class="flex items-center justify-between p-4 bg-surface-container-high rounded-xl">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary font-bold">S</div>
<div>
<p class="font-body font-semibold">Sarah</p>
<span class="text-[10px] bg-primary/10 text-primary px-2 py-0.5 rounded uppercase font-bold tracking-tighter">Host</span>
</div>
</div>
<div class="flex gap-2">
<span class="material-symbols-outlined text-on-surface-variant">shield_person</span>
</div>
</div>
<!-- Player: Alex -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant font-bold">A</div>
<div>
<p class="font-body font-semibold">Alex</p>
<p class="text-[10px] text-on-surface-variant font-mono uppercase">Connected</p>
</div>
</div>
<div class="flex gap-2">
<button class="p-2 text-on-surface-variant hover:text-secondary active:scale-90 transition-all">
<span class="material-symbols-outlined">history_edu</span>
</button>
<button class="p-2 text-on-surface-variant hover:text-error active:scale-90 transition-all">
<span class="material-symbols-outlined">person_remove</span>
</button>
</div>
</div>
<!-- Player: Chris -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant font-bold">C</div>
<div>
<p class="font-body font-semibold">Chris</p>
<p class="text-[10px] text-on-surface-variant font-mono uppercase">Connected</p>
</div>
</div>
<div class="flex gap-2">
<button class="p-2 text-on-surface-variant hover:text-secondary active:scale-90 transition-all">
<span class="material-symbols-outlined">history_edu</span>
</button>
<button class="p-2 text-on-surface-variant hover:text-error active:scale-90 transition-all">
<span class="material-symbols-outlined">person_remove</span>
</button>
</div>
</div>
</div>
</section>
<!-- Section 4: Game Management -->
<section class="space-y-4 pt-4 pb-12">
<button class="w-full h-14 bg-surface-bright rounded-xl flex items-center justify-center gap-3 font-label text-sm font-bold tracking-[0.2em] border border-outline-variant/10 hover:bg-surface-container-highest active:scale-98 transition-all">
<span class="material-symbols-outlined text-primary">pause_circle</span>
                PAUSE SESSION
            </button>
<button class="w-full h-14 bg-error-container/20 text-error rounded-xl flex items-center justify-center gap-3 font-label text-sm font-bold tracking-[0.2em] border border-error/20 hover:bg-error/10 active:scale-95 transition-all">
<span class="material-symbols-outlined">cancel</span>
                END GAME
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#131313]/80 backdrop-blur-xl border-t border-[#3FFF8B]/10 shadow-[0_-10px_40px_rgba(0,0,0,0.6)] rounded-t-2xl">
<a class="flex flex-col items-center justify-center text-[#2C2C2C] px-4 py-1.5 hover:text-[#3FFF8B]" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest font-bold mt-1">Wallet</span>
</a>
<a class="flex flex-col items-center justify-center text-[#2C2C2C] px-4 py-1.5 hover:text-[#3FFF8B]" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest font-bold mt-1">Ledger</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#3FFF8B]/10 text-[#3FFF8B] rounded-xl px-4 py-1.5" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest font-bold mt-1">Players</span>
</a>
</nav>
