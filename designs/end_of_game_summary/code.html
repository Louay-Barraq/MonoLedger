<!DOCTYPE html>

                        "on-tertiary-container": "#001429",
                        "on-background": "#ffffff",

                        "tertiary": "#44a5ff",

                        "on-primary-container": "#004f24",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(44, 44, 44, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .action-gradient {
            background: linear-gradient(135deg, #3fff8b 0%, #13ea79 100%);
        }
        .gold-glow {
            text-shadow: 0 0 15px rgba(255, 215, 9, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-dim text-on-background font-body selection:bg-primary selection:text-on-primary-container min-h-screen flex flex-col">
<!-- TopAppBar from Shared Components JSON -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#131313]">
<div class="flex items-center gap-3 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[#3FFF8B]">settings</span>
</div>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-xl text-[#3FFF8B]">ML-7724</h1>
<div class="flex items-center gap-3 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[#3FFF8B]">logout</span>
</div>
</header>
<main class="flex-1 mt-16 pb-32 px-6 pt-8 max-w-2xl mx-auto w-full">
<!-- Winner Spotlight: Celebration Card -->
<section class="mb-10 relative">
<div class="absolute -top-12 left-1/2 -translate-x-1/2 opacity-20 blur-3xl w-64 h-64 bg-secondary rounded-full"></div>
<div class="relative bg-surface-container-high rounded-2xl p-8 overflow-hidden flex flex-col items-center text-center shadow-[0_20px_40px_rgba(0,0,0,0.6)]">
<!-- Decorative Trophy Icon -->
<div class="mb-4 bg-secondary/10 w-20 h-20 rounded-full flex items-center justify-center border border-secondary/20">
<span class="material-symbols-outlined text-secondary text-5xl" style="font-variation-settings: 'FILL' 1;">trophy</span>
</div>
<p class="font-label text-secondary uppercase tracking-[0.2em] text-xs mb-2 font-bold">Grand Champion</p>
<h2 class="font-headline text-3xl font-extrabold text-on-surface mb-1 uppercase tracking-tight">ALEX RIVERA</h2>
<div class="mt-4 px-6 py-3 bg-surface-container-lowest rounded-xl border border-primary/20">
<p class="font-mono text-primary text-4xl font-black tracking-tighter">$14,200</p>
</div>
<!-- Abstract background pattern for winner card -->
<div class="absolute inset-0 opacity-5 pointer-events-none overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 border-4 border-secondary rounded-full -mr-16 -mt-16"></div>
<div class="absolute bottom-0 left-0 w-48 h-48 border-4 border-primary rounded-full -ml-24 -mb-24"></div>
</div>
</div>
</section>
<!-- Session Stats Grid: Tactical Layout -->
<section class="mb-10">
<h3 class="font-label text-on-surface-variant uppercase tracking-widest text-[10px] mb-4 font-bold">Session Analytics</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Total Money Moved -->
<div class="bg-surface-container-low p-5 rounded-xl flex flex-col justify-between h-32 border-l-2 border-tertiary">
<span class="material-symbols-outlined text-tertiary text-xl">payments</span>
<div>
<p class="font-label text-on-surface-variant text-[10px] uppercase tracking-wider">Total Volume</p>
<p class="font-mono text-on-surface text-xl font-bold">$45,800</p>
</div>
</div>
<!-- Most Active Trader -->
<div class="bg-surface-container-low p-5 rounded-xl flex flex-col justify-between h-32 border-l-2 border-secondary">
<span class="material-symbols-outlined text-secondary text-xl">swap_horiz</span>
<div>
<p class="font-label text-on-surface-variant text-[10px] uppercase tracking-wider">Most Active</p>
<p class="font-body text-on-surface text-xl font-bold">Sarah</p>
</div>
</div>
<!-- Duration -->
<div class="col-span-2 bg-surface-container-low p-5 rounded-xl flex items-center justify-between border-l-2 border-primary">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">schedule</span>
<div>
<p class="font-label text-on-surface-variant text-[10px] uppercase tracking-wider">Game Duration</p>
<p class="font-body text-on-surface text-lg font-bold">2h 15m</p>
</div>
</div>
<div class="text-right">
<p class="font-label text-on-surface-variant text-[10px] uppercase tracking-wider">Turns Completed</p>
<p class="font-mono text-primary text-lg font-bold">42</p>
</div>
</div>
</div>
</section>
<!-- Rankings List: Clean Editorial Style -->
<section class="mb-12">
<h3 class="font-label text-on-surface-variant uppercase tracking-widest text-[10px] mb-4 font-bold">Final Standings</h3>
<div class="space-y-3">
<!-- 1st Place (Already in spotlight, but shown here for consistency) -->
<div class="flex items-center justify-between p-4 bg-surface-container-high rounded-xl">
<div class="flex items-center gap-4">
<div class="w-8 h-8 flex items-center justify-center rounded-lg bg-secondary/20 text-secondary font-mono font-bold">1</div>
<span class="font-body font-semibold text-on-surface">Alex Rivera</span>
</div>
<span class="font-mono text-secondary font-bold">$14,200</span>
</div>
<!-- 2nd Place -->
<div class="flex items-center justify-between p-4 bg-surface-container rounded-xl">
<div class="flex items-center gap-4">
<div class="w-8 h-8 flex items-center justify-center rounded-lg bg-on-surface-variant/10 text-on-surface-variant font-mono font-bold text-sm">2</div>
<span class="font-body font-medium text-on-surface-variant">Sarah Jenkins</span>
</div>
<span class="font-mono text-on-surface-variant font-medium">$9,450</span>
</div>
<!-- 3rd Place -->
<div class="flex items-center justify-between p-4 bg-surface-container rounded-xl">
<div class="flex items-center gap-4">
<div class="w-8 h-8 flex items-center justify-center rounded-lg bg-on-surface-variant/10 text-on-surface-variant font-mono font-bold text-sm">3</div>
<span class="font-body font-medium text-on-surface-variant">Mike T.</span>
</div>
<span class="font-mono text-on-surface-variant font-medium">$3,100</span>
</div>
</div>
</section>
<!-- Save & Exit Action: High Visibility -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-background via-background to-transparent pt-12">
<button class="w-full action-gradient text-on-primary-container h-16 rounded-2xl flex items-center justify-center gap-3 active:scale-[0.98] transition-all shadow-[0_10px_30px_rgba(63,255,139,0.3)]">
<span class="material-symbols-outlined font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline font-extrabold tracking-tight text-lg uppercase">SAVE &amp; EXIT</span>
</button>
</div>
</main>
<!-- Invisible background imagery data attributes for generation -->
<div class="hidden" data-alt="Dark abstract technical background with neon green lines"></div>
<div class="hidden" data-alt="Geometric background with subtle grid and glow"></div>
</body></html>
