name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      # Info-level notes (Flutter's material.dart deprecation) do not fail the build.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Replays every migration on a fresh local database, then runs the pgTAP tests.
      - run: supabase db start
      - run: supabase test db
